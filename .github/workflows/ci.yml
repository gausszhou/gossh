name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Configure pnpm store
        # 显式固定 store-dir,并创建 pnpm store path 解析出的精确目录
        # (store-dir 会有 /v3 版本子目录),确保 setup-node 的缓存
        # 路径解析成功,避免 "Some specified paths were not resolved"
        run: |
          pnpm config set store-dir "${{ runner.temp }}/pnpm-store"
          mkdir -p "$(pnpm store path)"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: make install

      # build 必须先于 test:make build 的 frontend/static 链路会生成
      # internal/api/static 产物,go:embed all:static 在编译期需要该目录存在
      - name: Build
        run: make build

      - name: Test
        run: make test

      - name: Verify binary runs
        run: ./build/gossh version

      - name: Verify SFTP-tagged build compiles
        # SFTP 默认关闭(-tags sftp 才启用);这里保证启用变体始终可编译,
        # 避免 sftp_handler.go 在默认构建下长期不被编译而腐化
        run: CGO_ENABLED=0 go build -trimpath -tags sftp -o /dev/null .

      - name: Verify Windows build compiles
        # 桌面端 windows 实现(命名互斥体/注册表自启/纯 Go 托盘)只在
        # GOOS=windows 时编译;release.yml 只在打 tag 时交叉编译,
        # 这里保证每次 push/PR 都覆盖 Windows 桌面形态的编译
        run: CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath -o /dev/null .
