name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # 全量克隆:make release 的版本号来自 git describe --tags,
          # 默认 fetch-depth:1 不含 tag 引用会导致版本回退为兜底值
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Configure pnpm store
        # 显式固定 store-dir,并创建 pnpm store path 解析出的精确目录
        # (store-dir 会有 /v3 版本子目录),确保 setup-node 的缓存
        # 路径解析成功,避免 "Some specified paths were not resolved"
        run: |
          pnpm config set store-dir "${{ runner.temp }}/pnpm-store"
          mkdir -p "$(pnpm store path)"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: make install

      - name: Build all platforms
        # make release 产出 5 平台矩阵 + 各平台 tar.gz + sha256sums.txt
        run: make release

      - name: Verify binary
        run: ./build/gossh-linux-amd64 version

      - name: Verify sha256sums
        # 回归:资产与校验和一致(install.sh 依赖校验和)
        run: |
          cd build && sha256sum -c --ignore-missing sha256sums.txt

      - name: Build Linux AppImages (desktop mode)
        # 桌面形态(gossh app)走 cgo 托盘,产物为免安装 AppImage。
        # amd64 用 runner 原生 GTK 头;arm64 交叉:先注册 arm64 dpkg 架构,
        # apt 才能解析 :arm64 包(缺 dpkg --add-architecture 会
        # "Unable to locate package ...:arm64",apt 退出码 100)。
        # pkg-config-aarch64-linux-gnu 若镜像缺失,退化为普通 pkg-config
        # (PKG_CONFIG_LIBDIR 已指向 arm64 的 .pc 目录)。
        run: |
          sudo apt-get update
          sudo apt-get install -y libayatana-appindicator3-dev
          wget -q https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool-x86_64.AppImage
          export APPIMAGETOOL="$PWD/appimagetool-x86_64.AppImage"
          bash scripts/build-appimage.sh amd64
          sudo dpkg --add-architecture arm64
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          sudo apt-get install -y libayatana-appindicator3-dev:arm64
          if sudo apt-get install -y pkg-config-aarch64-linux-gnu; then
            PKG_CONFIG=aarch64-linux-gnu-pkg-config
          else
            sudo apt-get install -y pkg-config
            PKG_CONFIG=pkg-config
          fi
          CC=aarch64-linux-gnu-gcc \
          PKG_CONFIG="$PKG_CONFIG" \
          PKG_CONFIG_LIBDIR=/usr/lib/aarch64-linux-gnu/pkgconfig \
          bash scripts/build-appimage.sh arm64

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/gossh-linux-amd64
            build/gossh-linux-amd64.tar.gz
            build/gossh-linux-arm64
            build/gossh-linux-arm64.tar.gz
            build/gossh-linux-amd64.AppImage
            build/gossh-linux-arm64.AppImage
            build/gossh-darwin-amd64
            build/gossh-darwin-amd64.tar.gz
            build/gossh-darwin-arm64
            build/gossh-darwin-arm64.tar.gz
            build/gossh-windows-amd64.exe
            build/gossh-windows-amd64.exe.tar.gz
            build/sha256sums.txt
          generate_release_notes: true