name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # 全量克隆:make release 的版本号来自 git describe --tags,
          # 默认 fetch-depth:1 不含 tag 引用会导致版本回退为兜底值
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Configure pnpm store
        # 显式固定 store-dir,并创建 pnpm store path 解析出的精确目录
        # (store-dir 会有 /v3 版本子目录),确保 setup-node 的缓存
        # 路径解析成功,避免 "Some specified paths were not resolved"
        run: |
          pnpm config set store-dir "${{ runner.temp }}/pnpm-store"
          mkdir -p "$(pnpm store path)"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install UPX
        run: |
          curl -fsSL https://github.com/upx/upx/releases/download/v4.2.4/upx-4.2.4-amd64_linux.tar.xz \
            | sudo tar -xJ --strip-components=1 -C /usr/local/bin upx-4.2.4-amd64_linux/upx

      - name: Install dependencies
        run: make install

      - name: Build all platforms
        # make release 产出 5 平台矩阵 + sha256sums.txt(UPX 仅 linux)
        run: make release

      - name: Verify binary
        run: ./build/gossh-linux-amd64 version

      - name: Verify sha256sums
        # 回归:资产与校验和一致(install.sh 依赖校验和)
        run: |
          cd build && sha256sum -c --ignore-missing sha256sums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/gossh-linux-amd64
            build/gossh-linux-arm64
            build/gossh-darwin-amd64
            build/gossh-darwin-arm64
            build/gossh-windows-amd64.exe
            build/sha256sums.txt
          generate_release_notes: true